<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Offline · myHealthyAgent</title>
  <style>
    body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f7f9;color:#0f1c2a;padding:16px;box-sizing:border-box}
    @media (prefers-color-scheme:dark){body{background:#0b1218;color:#e8eef3}.card{background:#121c25!important}p{color:#a6b4c0!important}}
    .card{max-width:420px;padding:24px;border-radius:20px;background:#fff;text-align:center}
    h1{font-size:20px;margin:0 0 8px}p{margin:0 0 16px;color:#4b5b6b;line-height:1.5}
    button{font:inherit;font-weight:600;padding:12px 18px;border-radius:12px;border:0;background:#0e7490;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Open the app once while online and it will work offline after that. Your saved data is safe on this device.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
